<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout Dashboard — God-Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing:border-box;margin:0;padding:0; }
        body { font-family:'Inter',sans-serif;background:#0a0e1a;color:#e2e8f0;overflow-x:hidden;min-height:100vh; }
        .bg-container { position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none; }
        .bg-photo { position:absolute;inset:0;background-image:url('/bg.jpg');background-size:cover;background-position:center;opacity:0.18;filter:brightness(1.1) saturate(1.3) hue-rotate(10deg);animation:bgZoom 50s ease-in-out infinite alternate; }
        @keyframes bgZoom { 0%{transform:scale(1);} 100%{transform:scale(1.06);} }
        .bg-gradient { position:absolute;inset:0;background:radial-gradient(ellipse at 0% 0%,rgba(217,70,239,0.25) 0%,transparent 50%),radial-gradient(ellipse at 100% 0%,rgba(14,165,233,0.20) 0%,transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(16,185,129,0.18) 0%,transparent 50%),linear-gradient(135deg,rgba(10,14,26,0.82) 0%,rgba(15,20,40,0.78) 100%); }
        .bg-grid { position:absolute;inset:0;background-image:linear-gradient(rgba(217,70,239,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(217,70,239,0.06) 1px,transparent 1px);background-size:50px 50px;animation:gridDrift 40s linear infinite; }
        @keyframes gridDrift { 0%{transform:translate(0,0);} 100%{transform:translate(50px,50px);} }
        .scan-beam { position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(217,70,239,0.6),rgba(232,121,249,0.8),rgba(217,70,239,0.6),transparent);animation:scanMove 10s ease-in-out infinite;box-shadow:0 0 20px rgba(217,70,239,0.4); }
        @keyframes scanMove { 0%{top:0%;opacity:0;} 10%{opacity:1;} 90%{opacity:1;} 100%{top:100%;opacity:0;} }

        .top-bar { position:relative;z-index:10;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(10,14,26,0.6);backdrop-filter:blur(20px); }
        .brand-name { font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:900;letter-spacing:0.05em;background:linear-gradient(135deg,#e879f9,#d946ef,#c026d3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
        .brand-sub { font-family:'JetBrains Mono',monospace;font-size:0.58rem;color:rgba(148,163,184,0.65);letter-spacing:0.12em;margin-top:2px; }
        .ctrl-btn { display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:10px;font-size:0.72rem;font-weight:700;letter-spacing:0.04em;cursor:pointer;transition:all 0.2s ease;border:1px solid;backdrop-filter:blur(10px);font-family:'JetBrains Mono',monospace;text-decoration:none; }
        .ctrl-btn:hover { transform:translateY(-2px); }
        
        .btn-inject { background:linear-gradient(135deg,rgba(217,70,239,0.25),rgba(192,38,211,0.15));border-color:rgba(217,70,239,0.5);color:#f0abfc; }
        .btn-inject:hover { background:linear-gradient(135deg,rgba(217,70,239,0.4),rgba(192,38,211,0.25));color:#fae8ff; }
        .btn-back { background:linear-gradient(135deg,rgba(99,102,241,0.25),rgba(14,165,233,0.15));border-color:rgba(99,102,241,0.5);color:#a5b4fc; }
        .btn-back:hover { background:linear-gradient(135deg,rgba(99,102,241,0.4),rgba(14,165,233,0.25));color:#c7d2fe; }
        
        .stat-chip { display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:10px;background:rgba(15,23,42,0.7);border:1px solid rgba(255,255,255,0.07);backdrop-filter:blur(10px); }
        .live-badge { display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:10px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);backdrop-filter:blur(10px); }
        .pulse-dot { width:7px;height:7px;border-radius:50%;background:#10b981;position:relative; }
        .pulse-dot::after { content:'';position:absolute;inset:-3px;border-radius:50%;background:rgba(16,185,129,0.4);animation:pulseRing 1.5s ease-in-out infinite; }
        @keyframes pulseRing { 0%,100%{transform:scale(0.9);opacity:0.9;} 50%{transform:scale(1.5);opacity:0;} }

        .stats-bar { position:relative;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 24px;border-bottom:1px solid rgba(255,255,255,0.05);background:rgba(8,12,22,0.5);backdrop-filter:blur(10px);flex-wrap:wrap; }
        .stats-pill { display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:999px;font-size:0.68rem;font-weight:700;font-family:'JetBrains Mono',monospace; }
        .sp-bull { background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);color:#34d399; }
        .sp-bear { background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#f87171; }
        .sp-total { background:rgba(217,70,239,0.12);border:1px solid rgba(217,70,239,0.25);color:#e879f9; }
        .divider-v { width:1px;height:16px;background:rgba(255,255,255,0.1); }

        .main-layout { position:relative;z-index:10;display:flex;gap:16px;padding:16px 24px;flex:1;overflow:hidden;height:calc(100vh - 130px); }
        .coin-section { flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(217,70,239,0.3) transparent; }
        .coin-section::-webkit-scrollbar { width:4px; }
        .coin-section::-webkit-scrollbar-thumb { background:rgba(217,70,239,0.3);border-radius:4px; }
        .coin-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px; }

        .coin-card { border-radius:16px;padding:16px;position:relative;overflow:hidden;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);cursor:default; }
        .coin-card::before { content:'';position:absolute;inset:0;border-radius:16px;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,0.1),rgba(255,255,255,0.02));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none; }
        .coin-card:hover { transform:translateY(-4px) scale(1.01); }
        
        .card-bull { background:linear-gradient(135deg,rgba(5,46,22,0.9) 0%,rgba(6,78,59,0.75) 50%,rgba(15,30,50,0.85) 100%);border:1px solid rgba(16,185,129,0.4);box-shadow:0 0 30px rgba(16,185,129,0.12),0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(52,211,153,0.15); }
        .card-bear { background:linear-gradient(135deg,rgba(69,10,10,0.9) 0%,rgba(127,29,29,0.75) 50%,rgba(15,20,45,0.85) 100%);border:1px solid rgba(239,68,68,0.4);box-shadow:0 0 30px rgba(239,68,68,0.12),0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(248,113,113,0.15); }
        
        .card-symbol { font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;color:#f1f5f9;letter-spacing:0.02em;line-height:1; }
        .card-time { font-family:'JetBrains Mono',monospace;font-size:0.52rem;color:rgba(148,163,184,0.5);letter-spacing:0.06em;margin-top:4px; }
        
        .badge-tf { font-family:'JetBrains Mono',monospace;font-size:0.6rem;font-weight:700;letter-spacing:0.05em;padding:4px 10px;border-radius:6px;background:linear-gradient(135deg,rgba(217,70,239,0.2),rgba(192,38,211,0.1));border:1px solid rgba(217,70,239,0.4);color:#f0abfc; }

        .align-bar { margin-top:12px;padding:8px 10px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:0.55rem;display:flex;align-items:center;gap:8px; }
        .align-bar-god { background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);color:#34d399; }
        .align-bar-partial { background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.3);color:#fbbf24; }
        .align-bar-none { background:rgba(71,85,105,0.15);border:1px solid rgba(71,85,105,0.3);color:#64748b; }

        .feed-panel { width:280px;flex-shrink:0;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.07);background:rgba(8,12,22,0.85);backdrop-filter:blur(24px); }
        .feed-header { padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.06);background:linear-gradient(135deg,rgba(217,70,239,0.15),rgba(192,38,211,0.08));display:flex;align-items:center;justify-content:space-between;flex-shrink:0; }
        .feed-title { font-family:'Orbitron',sans-serif;font-size:0.65rem;font-weight:700;color:#e879f9;letter-spacing:0.1em; }
        .feed-body { flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px; }
        
        .log-card { padding:10px 12px;border-radius:10px;animation:logSlide 0.3s ease-out; }
        .log-card-bull { background:linear-gradient(135deg,rgba(5,46,22,0.8),rgba(6,78,59,0.4));border:1px solid rgba(16,185,129,0.25);border-left:3px solid #10b981; }
        .log-card-bear { background:linear-gradient(135deg,rgba(69,10,10,0.8),rgba(127,29,29,0.4));border:1px solid rgba(239,68,68,0.25);border-left:3px solid #ef4444; }
        @keyframes logSlide { from{opacity:0;transform:translateX(12px);} to{opacity:1;transform:translateX(0);} }
        .log-sym { font-family:'JetBrains Mono',monospace;font-size:0.75rem;font-weight:700;color:#f1f5f9; }
        .log-msg { font-family:'JetBrains Mono',monospace;font-size:0.62rem;color:rgba(203,213,225,0.75);margin-top:3px; }
        .log-time { font-family:'JetBrains Mono',monospace;font-size:0.55rem; }

        /* MODAL */
        .modal-backdrop { position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:16px; }
        .modal-box { background:linear-gradient(135deg,rgba(10,14,26,0.98),rgba(15,20,40,0.98));border:1px solid rgba(217,70,239,0.3);border-radius:20px;padding:28px;width:100%;max-width:540px;box-shadow:0 0 60px rgba(217,70,239,0.2); }
        .modal-title { font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:700;color:#e2e8f0;margin-bottom:4px; }
        .modal-sub { font-family:'JetBrains Mono',monospace;font-size:0.65rem;color:rgba(148,163,184,0.55);margin-bottom:20px; }
        .field-label { font-family:'JetBrains Mono',monospace;font-size:0.6rem;font-weight:700;text-transform:uppercase;color:rgba(148,163,184,0.6);display:block;margin-bottom:5px; }
        .field-input, .field-select { width:100%;padding:10px 14px;background:rgba(15,23,42,0.8);border:1px solid rgba(217,70,239,0.25);border-radius:10px;color:#e2e8f0;font-family:'JetBrains Mono',monospace;font-size:0.85rem;outline:none;margin-bottom:14px; }
        .field-input:focus, .field-select:focus { border-color:rgba(217,70,239,0.6);box-shadow:0 0 0 3px rgba(217,70,239,0.1); }
        
        .btn-cancel { flex:1;padding:11px;border-radius:10px;border:1px solid rgba(71,85,105,0.5);color:#94a3b8;background:rgba(15,23,42,0.5);font-family:'JetBrains Mono',monospace;font-size:0.8rem;font-weight:700;cursor:pointer;transition:all 0.2s; }
        .btn-inject-modal { flex:1;padding:11px;border-radius:10px;background:linear-gradient(135deg,rgba(217,70,239,0.3),rgba(192,38,211,0.2));border:1px solid rgba(217,70,239,0.5);color:#f0abfc;font-family:'JetBrains Mono',monospace;font-size:0.8rem;font-weight:700;cursor:pointer; }
        
        .inject-tf-block { padding:12px 14px;border-radius:12px;margin-bottom:10px;background:rgba(15,23,42,0.6);border:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between; }
        .inject-tf-title { font-family:'Orbitron',sans-serif;font-size:0.72rem;font-weight:700;color:#e879f9;letter-spacing:0.08em; }
        .inject-state-select { padding:5px 10px;border-radius:8px;background:rgba(15,23,42,0.8);border:1px solid rgba(217,70,239,0.3);color:#e2e8f0;font-family:'JetBrains Mono',monospace;font-size:0.75rem;cursor:pointer;outline:none; }
        .quick-fill-row { display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap; }
        .quick-btn { padding:5px 12px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:0.6rem;font-weight:700;cursor:pointer;transition:all 0.2s;border:1px solid; }
        .quick-btn-bull { background:rgba(16,185,129,0.15);border-color:rgba(16,185,129,0.4);color:#34d399; }
        .quick-btn-bull:hover { background:rgba(16,185,129,0.3); }
        .quick-btn-bear { background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.4);color:#f87171; }
        .quick-btn-bear:hover { background:rgba(239,68,68,0.3); }
        .quick-btn-none { background:rgba(71,85,105,0.15);border-color:rgba(71,85,105,0.4);color:#94a3b8; }
        .quick-btn-none:hover { background:rgba(71,85,105,0.3); }
        .inject-progress { font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:rgba(148,163,184,0.5);text-align:center;margin-top:8px;display:none; }
        .inject-progress.active { display:block; }
        .inject-progress .done { color:#34d399; }
        .inject-progress .fail { color:#f87171; }
    </style>
</head>
<body>

    <div class="bg-container"><div class="bg-photo"></div><div class="bg-gradient"></div><div class="bg-grid"></div><div class="scan-beam"></div></div>

    <div class="top-bar">
        <div style="display:flex;align-items:center;gap:14px;">
            <div style="width:42px;height:42px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,#e879f9,#d946ef,#c026d3);display:flex;align-items:center;justify-content:center;font-size:1.3rem;">💥</div>
            <div>
                <div class="brand-name">BREAKOUT DASHBOARD</div>
                <div class="brand-sub">LIVE BREAKOUT TRACKER · MULTI-TF</div>
            </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
            <button onclick="openModal()" class="ctrl-btn btn-inject"><span>⚡</span> INJECT BREAKOUT</button>
            <a href="/" class="ctrl-btn btn-back"><span>🏠</span> MAIN</a>
            <div class="stat-chip">
                <span style="font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:rgba(148,163,184,0.5);">COINS</span>
                <span id="coinCounter" style="font-family:'JetBrains Mono',monospace;font-size:0.85rem;font-weight:800;color:#e879f9;">0</span>
            </div>
            <div class="live-badge">
                <div class="pulse-dot"></div>
                <span style="font-family:'JetBrains Mono',monospace;font-size:0.7rem;font-weight:700;color:#34d399;">LIVE</span>
            </div>
        </div>
    </div>

    <div class="stats-bar">
        <span style="font-family:'JetBrains Mono',monospace;font-size:0.58rem;color:rgba(148,163,184,0.35);letter-spacing:0.12em;text-transform:uppercase;">Breakout Scan</span>
        <div class="divider-v"></div>
        <span id="bullPill" class="stats-pill sp-bull">🐂 0 BULLISH</span>
        <span id="bearPill" class="stats-pill sp-bear">🐻 0 BEARISH</span>
        <div class="divider-v"></div>
        <span id="totalPill" class="stats-pill sp-total">💥 0 TOTAL</span>
    </div>

    <div class="main-layout">
        <div class="coin-section">
            <div class="coin-grid" id="coinGrid">
                <p style="font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:rgba(148,163,184,0.3);grid-column:1/-1;text-align:center;padding:40px 0;">Awaiting Breakout signals...</p>
            </div>
        </div>
        <div class="feed-panel">
            <div class="feed-header">
                <span class="feed-title">📡 BREAKOUT FEED</span>
            </div>
            <div class="feed-body" id="activityFeed">
                <p style="font-family:'JetBrains Mono',monospace;font-size:0.65rem;color:rgba(148,163,184,0.3);text-align:center;padding:20px 0;">Awaiting signals...</p>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" id="modal">
        <div class="modal-box" style="max-width:540px;">
            <div class="modal-title">💥 Inject Breakout</div>
            <div class="modal-sub">Simulate multi-timeframe Breakout payloads.</div>
            
            <label class="field-label">Symbol</label>
            <input type="text" id="injSymbol" class="field-input" placeholder="e.g. BTCUSDT" style="text-transform:uppercase;">
            
            <div class="quick-fill-row">
                <span style="font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:rgba(148,163,184,0.4);align-self:center;margin-right:4px;">QUICK FILL:</span>
                <button class="quick-btn quick-btn-bull" onclick="quickFillAll('BULLISH')">🐂 ALL BULLISH</button>
                <button class="quick-btn quick-btn-bear" onclick="quickFillAll('BEARISH')">🐻 ALL BEARISH</button>
                <button class="quick-btn quick-btn-none" onclick="quickFillAll('NONE')">— ALL NONE</button>
            </div>
            
            <div id="tfBlocks"></div>
            
            <div class="inject-progress" id="injProgress"></div>
            
            <div style="display:flex;gap:10px;margin-top:16px;">
                <button onclick="closeModal()" class="btn-cancel">CANCEL</button>
                <button onclick="doInject()" id="injBtn" class="btn-inject-modal">INJECT 💥</button>
            </div>
        </div>
    </div>

    <script>
        const BREAKOUT_TFS = ['1MO', '1W'];
        const TF_LABELS = { '1MO':'MONTHLY', '1W':'WEEKLY' };

        // Build the dropdowns dynamically
        (function buildTfBlocks() {
            const container = document.getElementById('tfBlocks');
            container.innerHTML = BREAKOUT_TFS.map(tf => `
                <div class="inject-tf-block">
                    <span class="inject-tf-title">${TF_LABELS[tf]}</span>
                    <select id="inj_${tf}" class="inject-state-select">
                        <option value="NONE">⚪ NONE</option>
                        <option value="BULLISH">🟢 BULLISH</option>
                        <option value="BEARISH">🔴 BEARISH</option>
                    </select>
                </div>`).join('');
        })();

        const openModal = () => document.getElementById('modal').style.display = 'flex';
        const closeModal = () => {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('injSymbol').value = '';
            BREAKOUT_TFS.forEach(tf => { const el = document.getElementById('inj_'+tf); if(el) el.value='NONE'; });
            const prog = document.getElementById('injProgress');
            if (prog) { prog.innerHTML=''; prog.classList.remove('active'); }
        };
        document.getElementById('modal').addEventListener('click', e => { if(e.target === e.currentTarget) closeModal(); });

        function quickFillAll(state) { BREAKOUT_TFS.forEach(tf => { const el = document.getElementById('inj_'+tf); if(el) el.value=state; }); }

        async function doInject() {
            const sym = document.getElementById('injSymbol').value.toUpperCase().trim();
            const btn = document.getElementById('injBtn');
            const prog = document.getElementById('injProgress');

            if (!sym) return alert('Please enter a symbol.');

            // Gather only the timeframes that are NOT set to NONE
            const tfs = BREAKOUT_TFS.map(tf => ({ 
                tf, direction: document.getElementById('inj_'+tf)?.value || 'NONE' 
            })).filter(t => t.direction !== 'NONE');

            if (!tfs.length) return alert('Set at least one breakout direction.');

            btn.textContent = 'INJECTING...';
            btn.style.pointerEvents = 'none';
            prog.innerHTML = '';
            prog.classList.add('active');

            let success = 0, fail = 0;

            // Loop and send webhook payload sequentially
            for (const t of tfs) {
                try {
                    const r = await fetch('/webhook', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ kind: 'BREAKOUT', symbol: sym, direction: t.direction, chart_tf: t.tf })
                    });
                    if (r.ok) { 
                        success++; 
                        prog.innerHTML += `<span class="done">✅ ${t.tf} → ${t.direction}</span><br>`; 
                    } else { 
                        fail++; 
                        prog.innerHTML += `<span class="fail">❌ ${t.tf} failed (${r.status})</span><br>`; 
                    }
                } catch {
                    fail++; 
                    prog.innerHTML += `<span class="fail">❌ ${t.tf} error</span><br>`;
                }
                await new Promise(r => setTimeout(r, 250)); // Tiny delay to prevent spamming
            }

            if (fail === 0) {
                prog.innerHTML += `<br><span class="done">🎯 All breakouts injected for ${sym}!</span>`;
                setTimeout(() => closeModal(), 1200);
            } else {
                prog.innerHTML += `<br><span class="fail">⚠️ ${fail} failed, ${success} succeeded</span>`;
            }

            btn.textContent = 'INJECT 💥';
            btn.style.pointerEvents = 'auto';
        }

        function render(breakoutState, activityLog) {
            const syms = Object.keys(breakoutState || {});
            
            let bulls = 0, bears = 0;
            syms.forEach(sym => {
                if(breakoutState[sym].direction === 'BULLISH') bulls++;
                if(breakoutState[sym].direction === 'BEARISH') bears++;
            });

            document.getElementById('coinCounter').textContent = syms.length;
            document.getElementById('bullPill').textContent = `🐂 ${bulls} BULLISH`;
            document.getElementById('bearPill').textContent = `🐻 ${bears} BEARISH`;
            document.getElementById('totalPill').textContent = `💥 ${syms.length} TOTAL`;

            const grid = document.getElementById('coinGrid');
            if (!syms.length) {
                grid.innerHTML = '<p style="font-family:\'JetBrains Mono\',monospace;font-size:0.75rem;color:rgba(148,163,184,0.3);grid-column:1/-1;text-align:center;padding:40px 0;">Awaiting Breakout signals...</p>';
            } else {
                grid.innerHTML = '';
                // Sort newest first
                syms.sort((a, b) => breakoutState[b].timestamp - breakoutState[a].timestamp).forEach(sym => {
                    const data = breakoutState[sym];
                    const cardCls = data.direction === 'BULLISH' ? 'card-bull' : 'card-bear';
                    const emoji = data.direction === 'BULLISH' ? '🐂 BULLISH' : '🐻 BEARISH';
                    
                    let alignTag = `<div class="align-bar align-bar-none">⚠️ Storyline Unaligned</div>`;
                    if(data.aligned) {
                        const style = data.alignType === 'GOD' ? 'align-bar-god' : 'align-bar-partial';
                        alignTag = `<div class="align-bar ${style}">✅ Aligned: ${data.alignType} (${data.alignCount}/2)</div>`;
                    }

                    const timeStr = new Date(data.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});

                    grid.insertAdjacentHTML('beforeend', `
                        <div class="coin-card ${cardCls}">
                            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                                <div>
                                    <div class="card-symbol">${sym}</div>
                                    <div class="card-time">🕐 ${timeStr}</div>
                                </div>
                                <span class="badge-tf">${data.chartTf || 'UNK'}</span>
                            </div>
                            <div style="margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:0.7rem;font-weight:700;">
                                ${emoji}
                            </div>
                            ${alignTag}
                        </div>`);
                });
            }

            const feed = document.getElementById('activityFeed');
            const breakoutLogs = activityLog.filter(l => l.logAction === 'BREAKOUT');
            
            if (!breakoutLogs.length) {
                feed.innerHTML = '<p style="font-family:\'JetBrains Mono\',monospace;font-size:0.65rem;color:rgba(148,163,184,0.3);text-align:center;padding:20px 0;">Awaiting signals...</p>';
            } else {
                feed.innerHTML = breakoutLogs.slice(0, 80).map(e => {
                    const cls = e.direction === 'BULLISH' ? 'log-card-bull' : 'log-card-bear';
                    const tc = e.direction === 'BULLISH' ? 'rgba(52,211,153,0.8)' : 'rgba(248,113,113,0.8)';
                    const icon = e.direction === 'BULLISH' ? '🐂' : '🐻';
                    const timeStr = new Date(e.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
                    
                    return `<div class="log-card ${cls}">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
                            <span class="log-sym">${icon} ${e.symbol} <span style="font-size:0.55rem;color:#cbd5e1;">(${e.chart_tf})</span></span>
                            <span class="log-time" style="color:${tc};">${timeStr}</span>
                        </div>
                        <div class="log-msg">${e.message}</div>
                    </div>`;
                }).join('');
            }
        }

        fetch('/api/state').then(r => r.json()).then(data => render(data.breakoutState, data.activityLog || []));

        const es = new EventSource('/api/stream');
        es.onmessage = e => {
            const data = JSON.parse(e.data);
            if (data.breakoutState) render(data.breakoutState, data.activityLog || []);
        };
    </script>
</body>
</html>
